:root{--l-bg:#F5F5F2;--l-fg:#0F1115;--l-muted:#6B7280;--l-card:rgba(255,255,255,.72);--l-edge:rgba(255,255,255,.8);--l-acc:#10C27F;--l-acc2:#057A4C;color-scheme:light dark}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--l-bg);color:var(--l-fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
 background:radial-gradient(60% 40% at 18% 8%,color-mix(in srgb,var(--l-acc) 39%,transparent),transparent 72%),radial-gradient(55% 38% at 92% 40%,color-mix(in srgb,#6EA0F0 30%,transparent),transparent 72%),radial-gradient(70% 45% at 40% 100%,color-mix(in srgb,#B793F0 28%,transparent),transparent 72%),var(--l-bg)}
html.auto #wait,html.auto #f{visibility:hidden}html.auto.slow #wait{visibility:visible}
.box{width:100%;max-width:360px;padding:26px 22px 22px;border-radius:28px;background:linear-gradient(155deg,rgba(255,255,255,.35),transparent 45%),var(--l-card);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--l-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 24px 60px -24px rgba(0,0,0,.35);text-align:center}
.logo{width:64px;height:64px;border-radius:16px;margin:0 auto 12px;display:block;box-shadow:0 10px 30px -10px rgba(6,150,92,.45)}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
p.sub{margin:6px 0 18px;color:var(--l-muted);font-size:14px}
input[type=password]{width:100%;height:50px;border-radius:14px;border:1px solid var(--l-edge);background:color-mix(in srgb,var(--l-bg) 70%,transparent);color:var(--l-fg);font:inherit;font-size:17px;padding:0 14px;text-align:center;-webkit-appearance:none;appearance:none;outline:none}
input[type=password]:focus{border-color:var(--l-acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--l-acc) 25%,transparent)}
label.rem{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 16px;font-size:14px;color:var(--l-muted)}
label.rem input{width:18px;height:18px;accent-color:var(--l-acc2)}
button{width:100%;height:50px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(170deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(135deg,#17D08A,#06804F);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -10px rgba(6,150,92,.6);cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:20px;margin:12px 0 0;font-size:13.5px;color:var(--l-muted)}.msg.bad{color:#D3261B}
.wait{color:var(--l-muted);font-size:15px}
.foot{margin-top:16px;font-size:11.5px;color:var(--l-muted)}
[hidden]{display:none!important}

function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function b64(a){var s='';a=new Uint8Array(a);for(var i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s);}
function $(i){return document.getElementById(i);}
async function fromPw(pw){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function openWith(key){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},key,u8(D.ct));var html;
  if(typeof DecompressionStream==='function'){html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}else{throw new Error('alt');}
  if(window.__sp)html=html.replace(/<body([^>]*)>/,function(m){return m+window.__sp.html;});document.open();document.write(html);document.close();}
function showForm(t,bad){document.documentElement.classList.remove('auto');$('wait').hidden=true;$('f').hidden=false;$('msg').textContent=t||'';$('msg').className='msg'+(bad?' bad':'');setTimeout(function(){try{$('pw').focus();}catch(e){}},50);}
(async function(){
  if(!window.crypto||!crypto.subtle){showForm('Dieser Browser kann die Seite nicht entschlüsseln.',true);return;}
  var st=null;try{st=JSON.parse(localStorage.getItem('vb-pk')||'null');}catch(e){}
  if(st&&st.s===D.s&&st.k){try{var k=await crypto.subtle.importKey('raw',u8(st.k),{name:'AES-GCM'},false,['decrypt']);await openWith(k);return;}catch(e){try{localStorage.removeItem('vb-pk');localStorage.removeItem('vb-splash');}catch(_){} if(window.__sp){location.reload();return;}}}
  showForm();
})();
$('f').addEventListener('submit',async function(ev){ev.preventDefault();var pw=$('pw').value;if(!pw)return;$('go').disabled=true;$('msg').className='msg';$('msg').textContent='Entschlüssele …';
  try{var k=await fromPw(pw);await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},k,u8(D.ct));
    if($('rem').checked){try{var raw=await crypto.subtle.exportKey('raw',k);localStorage.setItem('vb-pk',JSON.stringify({s:D.s,k:b64(raw)}));}catch(e){}}
    await openWith(k);
  }catch(e){$('go').disabled=false;showForm(e&&e.message==='alt'?'Bitte iOS aktualisieren – dieser Browser ist zu alt.':'Passwort stimmt nicht.',true);$('pw').select();}
});
